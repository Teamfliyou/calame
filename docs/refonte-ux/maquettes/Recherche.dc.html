<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500"><mark style="background: rgba(244,183,64,.5); color: inherit; border-radius: 3px; padding: 0 1px">Dériv</mark>ées</span><span style="font-size: 12px; color: #5B616E">Dans Analyse — Ch. 4 · 5 pages</span></span>
