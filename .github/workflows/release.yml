name: Publication

# Se déclenche en poussant une étiquette de version : git tag v1.0.0 && git push --tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Archive portable et installeur
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          .\scripts\package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Dépendances
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - name: Paquet .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb -p calame-app --profile dist -o dist/
      - name: Archive tar.gz
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name="calame-${version}-linux-x64"
          mkdir -p "dist/${name}"
          cp target/dist/calame "dist/${name}/calame"
          cp LICENSE-MIT LICENSE-APACHE README.md docs/guide-utilisateur.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilation
        run: cargo build --profile dist -p calame-app
      - name: Archive tar.gz (non signée)
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name="calame-${version}-macos"
          mkdir -p "dist/${name}"
          cp target/dist/calame "dist/${name}/calame"
          cp LICENSE-MIT LICENSE-APACHE README.md docs/guide-utilisateur.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.tar.gz

  release:
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
