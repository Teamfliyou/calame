name: Publication

# Publie automatiquement la version de Cargo.toml (Windows seulement) à chaque envoi sur main,
# si cette version n'a pas encore de publication. Relançable à la main : onglet Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: version
        shell: pwsh
        run: |
          $m = Get-Content Cargo.toml -Raw
          if ($m -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "Version introuvable" }
          "tag=v$($Matches[1])" >> $env:GITHUB_OUTPUT
      - name: Publication déjà faite ?
        id: exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" *> $null
          "done=$($LASTEXITCODE -eq 0)".ToLower() >> $env:GITHUB_OUTPUT
          $global:LASTEXITCODE = 0
      - uses: dtolnay/rust-toolchain@stable
        if: steps.exists.outputs.done != 'true'
      - name: Inno Setup
        if: steps.exists.outputs.done != 'true'
        run: choco install innosetup -y --no-progress
      - name: Archive portable et installeur
        if: steps.exists.outputs.done != 'true'
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          .\scripts\package-windows.ps1
      - name: Publier
        if: steps.exists.outputs.done != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.zip
            dist/*-setup.exe
          generate_release_notes: true
