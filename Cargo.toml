[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Teamfliyou/calame"
authors = ["Calame contributors"]
rust-version = "1.80"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
# Binaire plus petit : les symboles de débogage sont retirés.
strip = true

# Pour les paquets distribués : cargo build --profile dist -p calame-app
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
